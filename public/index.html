<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NewsDesk</title><style>
:root{--bg:#f5f6fb;--ink:#202638;--muted:#788196;--line:#e7eaf2;--accent:#5968d9;--green:#168653}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 20px 50px}header,.hero,.tabs,.tools,.source,.item{display:flex;gap:12px;align-items:center}header{justify-content:space-between;margin-bottom:20px}.logo{background:#6875e8;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0}.brand small,.muted,.meta{color:var(--muted)}button,input,select{font:inherit}.btn,.tab,.small{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}.hero{justify-content:space-between;background:linear-gradient(110deg,#fff,#eef0ff);padding:18px 20px;border-radius:17px;border:1px solid #e7eaff}.hero h2{margin:0 0 4px}.stats{display:flex;gap:22px}.stats b{display:block;font-size:21px}.stats small{color:var(--muted)}.tabs{margin:20px 0 12px;flex-wrap:wrap}.tab.active{background:#eef0ff;color:#4c59c8}.tools{margin-bottom:12px}.tools input{flex:1;min-width:180px}.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.feed,.grid{display:grid;gap:9px}.item,.source{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.item{align-items:flex-start}.item.unread{border-left:4px solid #20a36a}.body{flex:1}.body h3{font-size:14px;margin:3px 0}.body p{font-size:12px;color:var(--muted);margin:0 0 7px}.body a{font-size:12px;color:var(--accent);text-decoration:none}.source{justify-content:space-between}.source .info{flex:1}.source small{display:block;color:var(--muted)}.badge{font-size:10px;background:#f0f2f6;border-radius:20px;padding:4px 7px}.ok{color:var(--green);background:#e9f8f0}.err{color:#b54747;background:#fff0f0}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.empty{padding:35px;background:#fff;border:1px dashed var(--line);border-radius:13px;text-align:center;color:var(--muted)}@media(max-width:720px){.wrap{padding:16px 12px}.hero{display:block}.stats{margin-top:15px;justify-content:space-between}.grid{grid-template-columns:1fr}.tools{flex-wrap:wrap}.tools input{width:100%}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo">N</div><div><h1>NewsDesk</h1><small>Моніторинг відкритих джерел</small></div></div><button class="btn" id="check">↻ Перевірити</button></header><section class="hero"><div><h2>Твоя редакційна панель</h2><div class="muted">Нові публікації та швидкий доступ до першоджерел</div></div><div class="stats"><div><b id="sn">—</b><small>джерел</small></div><div><b id="un">—</b><small>непрочитаних</small></div></div></section><nav class="tabs"><button class="tab active" data-tab="feed">Стрічка</button><button class="tab" data-tab="sources">Джерела</button><button class="tab" data-tab="saved">Збережене</button></nav><div class="tools"><input id="q" placeholder="Пошук новин або джерел"><select id="cat"><option value="">Усі категорії</option><option>Telegram</option><option>Медіа</option><option>Львівщина</option><option>Західні області</option><option>Facebook</option></select></div><div id="view"><div class="empty">Завантаження…</div></div><p class="muted" style="font-size:11px;margin-top:20px">Перевірка запланована щохвилини. Фактична швидкість залежить від доступності публічних сторінок та RSS. Facebook наразі працює як швидке посилання.</p></div><script>
let S={sources:[],items:[]},tab="feed";const $=x=>document.getElementById(x),esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(r.status);return r.json()}async function load(){try{S=await api("/api/state");render()}catch(e){$("view").innerHTML='<div class="empty">Не вдалося підключитися до бази даних. Перевір D1 binding та міграцію schema.sql.</div>'}}function render(){$("sn").textContent=S.sources.length;$("un").textContent=S.items.filter(x=>!x.is_read).length;let q=$("q").value.toLowerCase(),cat=$("cat").value;if(tab==="sources"){$("view").innerHTML='<div class="grid">'+S.sources.filter(x=>(!cat||x.category===cat)&&(!q||x.name.toLowerCase().includes(q))).map(x=>`<div class="source"><div class="info"><b>${esc(x.name)}</b><small>${esc(x.category)} · ${esc(x.status_message||"Ще не перевірено")}</small></div><span class="badge ${x.status==="ok"?"ok":x.status==="error"?"err":""}">${esc(x.type)}</span><a href="${esc(x.url)}" target="_blank">↗</a></div>`).join("")+'</div>';return}let items=S.items.filter(x=>(tab!=="saved"||x.is_saved)&&(!cat||x.category===cat)&&(!q||(x.title+" "+x.source_name).toLowerCase().includes(q)));$("view").innerHTML=items.length?'<div class="feed">'+items.map(x=>`<article class="item ${x.is_read?"":"unread"}"><div class="body"><div class="meta">${esc(x.source_name)} · ${esc(x.published_at||x.created_at)}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><a href="${esc(x.url)}" target="_blank">Відкрити оригінал ↗</a></div><button class="small" data-read="${esc(x.id)}">${x.is_read?"✓":"○"}</button><button class="small" data-save="${esc(x.id)}">${x.is_saved?"★":"☆"}</button></article>`).join("")+'</div>':'<div class="empty">Поки немає нових публікацій. Перевір статуси джерел у вкладці «Джерела».</div>';document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{await api("/api/items/"+encodeURIComponent(b.dataset.read)+"/read",{method:"POST"});load()});document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{await api("/api/items/"+encodeURIComponent(b.dataset.save)+"/save",{method:"POST"});load()})}document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});$("q").oninput=render;$("cat").onchange=render;$("check").onclick=async()=>{await api("/api/check",{method:"POST"});setTimeout(load,2500)};load();setInterval(load,15000);
</script></body></html>
